{{- if and .Values.migrations.enabled (not .Values.postgresql.existingSecret) }}
# Ordinary release Secrets are updated after pre-upgrade hooks. This hook Secret
# makes the incoming DSN available before the migration Job starts.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rochallor.fullname" . }}-migrations-db
  labels:
    {{- include "rochallor.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  dsn: {{ .Values.postgresql.dsn | quote }}
{{- end }}
