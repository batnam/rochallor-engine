apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rochallor.fullname" . }}
  labels:
    {{- include "rochallor.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "rochallor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "rochallor.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "rochallor.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: engine
          image: {{ include "rochallor.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: rest
              containerPort: {{ .Values.engine.rest.port }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.engine.grpc.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.engine.metrics.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "rochallor.fullname" . }}
          env:
            - name: WE_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "rochallor.dbSecretName" . }}
                  key: {{ .Values.postgresql.existingSecretKey }}
            {{- if and
                  (eq .Values.engine.dispatchMode "kafka_outbox")
                  (eq .Values.kafka.transport "sasl_scram_tls")
            }}
            - name: WE_KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "rochallor.kafkaSecretName" . }}
                  key: {{ .Values.kafka.existingSecretUsernameKey }}
            - name: WE_KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rochallor.kafkaSecretName" . }}
                  key: {{ .Values.kafka.existingSecretPasswordKey }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: rest
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: rest
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: rest
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
