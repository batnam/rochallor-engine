{{- if .Values.migrations.enabled }}
# Pre-upgrade hook uses the incoming engine image and migration-only CLI.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rochallor.fullname" . }}-migrations
  labels:
    {{- include "rochallor.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    {{- with .Values.migrations.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  backoffLimit: 1
  template:
    metadata:
      labels:
        {{- include "rochallor.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: migrate
          image: {{ include "rochallor.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/engine", "-migrate-only"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: WE_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.postgresql.existingSecret }}{{ include "rochallor.dbSecretName" . }}{{ else }}{{ include "rochallor.fullname" . }}-migrations-db{{ end }}
                  key: {{ if .Values.postgresql.existingSecret }}{{ .Values.postgresql.existingSecretKey }}{{ else }}dsn{{ end }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
