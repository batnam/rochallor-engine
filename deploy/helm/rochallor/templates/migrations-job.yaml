{{- if .Values.migrations.enabled }}
# Migrations run automatically on every engine startup, so this Job is optional.
# When enabled, it runs as a pre-upgrade Helm hook: the engine binary starts,
# applies any pending migrations, the health endpoint turns green, then the
# wrapper exits 0 — signalling Helm to proceed with the main rollout.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rochallor.fullname" . }}-migrations
  labels:
    {{- include "rochallor.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    {{- with .Values.migrations.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  backoffLimit: 1
  template:
    metadata:
      labels:
        {{- include "rochallor.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "rochallor.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: migrate
          image: {{ include "rochallor.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Start the engine in background, poll health (migrations complete once
          # health returns 200), then shut down cleanly and exit 0.
          command: ["/bin/sh", "-c"]
          args:
            - |
              /engine &
              EPID=$!
              PORT="{{ .Values.engine.rest.port }}"
              until wget -qO- "http://127.0.0.1:${PORT}/healthz" >/dev/null 2>&1; do
                sleep 2
              done
              kill "$EPID"
              wait "$EPID" 2>/dev/null || true
              echo "Migrations complete."
              exit 0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: {{ include "rochallor.fullname" . }}
          env:
            - name: WE_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "rochallor.dbSecretName" . }}
                  key: {{ .Values.postgresql.existingSecretKey }}
            {{- if and
                  (eq .Values.engine.dispatchMode "kafka_outbox")
                  (eq .Values.kafka.transport "sasl_scram_tls")
            }}
            - name: WE_KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "rochallor.kafkaSecretName" . }}
                  key: {{ .Values.kafka.existingSecretUsernameKey }}
            - name: WE_KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rochallor.kafkaSecretName" . }}
                  key: {{ .Values.kafka.existingSecretPasswordKey }}
            {{- end }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
