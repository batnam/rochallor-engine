# Rochallor Quick Start
#
# Starts the workflow engine + PostgreSQL using pre-built images, and builds
# the visual modeller from source.
#
# Usage:
#   docker compose -f docker-compose.quickstart.yml up
#
# Modeller: http://localhost:3000
# Engine:   http://localhost:8080
# gRPC:     localhost:9090
# Metrics:  http://localhost:9091/metrics

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow
      POSTGRES_DB: workflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow -d workflow"]
      interval: 3s
      timeout: 5s
      retries: 15

  engine:
    image: ghcr.io/batnam/rochallor-engine:latest
    restart: unless-stopped
    environment:
      WE_POSTGRES_DSN: postgres://workflow:workflow@postgres:5432/workflow?sslmode=disable
      WE_DISPATCH_MODE: polling
      WE_LOG_LEVEL: info
    ports:
      - "8080:8080"
      - "9090:9090"
      - "9091:9091"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 20

  modeller:
    build:
      context: ../workflow-modeller
    restart: unless-stopped
    ports:
      - "3000:3000"

volumes:
  pgdata:
