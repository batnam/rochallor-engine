name: Publish Helm Chart

on:
  push:
    tags:
      - 'helm-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  packages: write

jobs:
  verify:
    uses: ./.github/workflows/verify-helm.yml
    permissions:
      contents: read
    with:
      released-engine: true

  publish-helm-chart:
    name: Publish Helm chart → GHCR OCI
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install oras
        uses: oras-project/setup-oras@v1

      - uses: actions/download-artifact@v6
        with:
          name: verified-helm-package
          path: artifacts/helm

      - name: Publish verified package without repackaging
        run: |
          sha256sum --check artifacts/helm/SHA256SUMS
          VERSION=${GITHUB_REF_NAME#helm-v}
          helm push "artifacts/helm/rochallor-${VERSION}.tgz" \
            oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Push Artifact Hub metadata
        run: |
          oras push ghcr.io/${{ github.repository_owner }}/charts:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            deploy/helm/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-helm-chart]
    steps:
      - uses: actions/checkout@v5

      - name: Extract version
        id: ver
        run: echo "tag=${GITHUB_REF_NAME#helm-}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          name: Helm Chart ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          make_latest: false
