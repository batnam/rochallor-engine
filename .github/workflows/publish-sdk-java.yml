name: Publish Java SDK

on:
  push:
    tags:
      - 'sdk-java-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write

jobs:
  publish-sdk-java:
    name: Publish Java SDK → Maven Central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Publish to Maven Central
        working-directory: workflow-sdk-java
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache -Pversion=${GITHUB_REF_NAME#sdk-java-v}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-sdk-java]
    steps:
      - uses: actions/checkout@v5

      - name: Extract version
        id: ver
        run: echo "tag=${GITHUB_REF_NAME#sdk-java-}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          name: Java SDK ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          make_latest: false
