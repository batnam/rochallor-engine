name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish-engine:
    name: Publish Docker image → GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./workflow-engine
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rochallor-engine:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/rochallor-engine:latest

  publish-sdk-python:
    name: Publish Python SDK → PyPI
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set version from tag
        working-directory: workflow-sdk-python
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/^version = .*/version = \"${VERSION}\"/" pyproject.toml

      - name: Build
        working-directory: workflow-sdk-python
        run: pip install build && python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: workflow-sdk-python/dist/

  publish-sdk-node:
    name: Publish Node SDK → npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler

      - name: Install dependencies
        working-directory: workflow-sdk-node
        run: npm install

      - name: Generate proto code
        working-directory: workflow-sdk-node
        run: mkdir -p src/generated && npm run proto-gen

      - name: Build
        working-directory: workflow-sdk-node
        run: npm run build

      - name: Set version and publish
        working-directory: workflow-sdk-node
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          npm version ${VERSION} --no-git-tag-version
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-sdk-java:
    name: Publish Java SDK → GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Publish to GitHub Packages
        working-directory: workflow-sdk-java
        run: ./gradlew publish -Pversion=${GITHUB_REF_NAME#v}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tag-go-sdk:
    name: Tag Go SDK module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create go module tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "workflow-sdk-go/${{ github.ref_name }}"
          git push origin "workflow-sdk-go/${{ github.ref_name }}"

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-engine, publish-sdk-python, publish-sdk-node, publish-sdk-java, tag-go-sdk]
    steps:
      - uses: actions/checkout@v4

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
