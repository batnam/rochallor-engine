name: Publish Python SDK

on:
  push:
    tags:
      - 'sdk-python-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write

jobs:
  publish-sdk-python:
    name: Publish Python SDK → PyPI
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set version from tag
        working-directory: workflow-sdk-python
        run: |
          VERSION=${GITHUB_REF_NAME#sdk-python-v}
          sed -i "s/^version = .*/version = \"${VERSION}\"/" pyproject.toml

      - name: Build
        working-directory: workflow-sdk-python
        run: pip install build && python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: workflow-sdk-python/dist/
          skip-existing: true

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-sdk-python]
    steps:
      - uses: actions/checkout@v5

      - name: Extract version
        id: ver
        run: echo "tag=${GITHUB_REF_NAME#sdk-python-}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          name: Python SDK ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          make_latest: false
