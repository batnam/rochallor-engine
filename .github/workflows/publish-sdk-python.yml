name: Publish Python SDK

on:
  push:
    tags:
      - 'sdk-python-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    uses: ./.github/workflows/verify-sdk-python.yml
    with:
      version: ${{ github.ref_name }}

  publish-sdk-python:
    name: Publish Python SDK → PyPI
    runs-on: ubuntu-latest
    needs: verify
    environment: pypi
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v7
        with:
          name: python-sdk-candidate
          path: workflow-sdk-python/
      - name: Verify source, version and distribution checksums
        working-directory: workflow-sdk-python
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          python - <<'PYCODE'
          import json, os
          metadata = json.load(open('artifacts/package.json'))
          assert metadata['source'] == os.environ['GITHUB_SHA']
          assert metadata['version'] == os.environ['GITHUB_REF_NAME'].removeprefix('sdk-python-v')
          PYCODE
          mkdir -p verified-publish
          cp dist/*.whl dist/*.tar.gz verified-publish/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: workflow-sdk-python/verified-publish/

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-sdk-python]
    steps:
      - uses: actions/checkout@v5

      - name: Extract version
        id: ver
        run: echo "tag=${GITHUB_REF_NAME#sdk-python-}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          name: Python SDK ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          make_latest: false
