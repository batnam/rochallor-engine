name: Publish Modeller

on:
  push:
    tags:
      - 'modeller-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish-modeller:
    name: Publish Modeller image → GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: ver
        run: echo "tag=${GITHUB_REF_NAME#modeller-}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./workflow-modeller
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=modeller
          cache-to: type=gha,mode=max,scope=modeller
          tags: |
            ghcr.io/${{ github.repository_owner }}/rochallor-modeller:${{ steps.ver.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/rochallor-modeller:latest

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-modeller]
    steps:
      - uses: actions/checkout@v5

      - name: Extract version
        id: ver
        run: echo "tag=${GITHUB_REF_NAME#modeller-}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          name: Modeller ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          make_latest: false
