name: engine-e2e

on:
  push:
    branches: [main]
    paths:
      - 'workflow-engine/**'
      - 'workflow-sdk-go/**'
      - 'workflow-sdk-python/**'
      - 'workflow-sdk-node/**'
      - 'workflow-sdk-java/**'
      - 'proto/**'
      - 'e2e/**'
      - '.github/workflows/engine-e2e.yml'
      - '.github/workflows/verify-sdk-node.yml'
      - '.github/workflows/publish-sdk-node.yml'
      - '.github/workflows/verify-sdk-java.yml'
      - '.github/workflows/publish-sdk-java.yml'
      - '.github/workflows/verify-sdk-python.yml'
      - '.github/workflows/publish-sdk-python.yml'
      - '.github/workflows/verify-sdk-go.yml'
      - '.github/workflows/publish-sdk-go.yml'
  pull_request:
    paths:
      - 'workflow-engine/**'
      - 'workflow-sdk-go/**'
      - 'workflow-sdk-python/**'
      - 'workflow-sdk-node/**'
      - 'workflow-sdk-java/**'
      - 'proto/**'
      - 'e2e/**'
      - '.github/workflows/engine-e2e.yml'
      - '.github/workflows/verify-sdk-node.yml'
      - '.github/workflows/publish-sdk-node.yml'
      - '.github/workflows/verify-sdk-java.yml'
      - '.github/workflows/publish-sdk-java.yml'
      - '.github/workflows/verify-sdk-python.yml'
      - '.github/workflows/publish-sdk-python.yml'
      - '.github/workflows/verify-sdk-go.yml'
      - '.github/workflows/publish-sdk-go.yml'
  workflow_dispatch:
  workflow_call:

# Cancel redundant runs on the same PR; let main pushes always complete.
concurrency:
  group: engine-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  contract-replay:
    name: REST contract replay and negative command tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: workflow-engine/go.mod
          cache-dependency-path: workflow-engine/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r workflow-engine/test/contract/requirements.txt
      - run: python -m unittest discover -s workflow-engine/test/contract -p 'test_*.py' -v
      - run: python workflow-engine/test/contract/run.py --output=testresults/contract
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-replay
          path: testresults/contract/

  go-sdk:
    name: Go SDK and four E2E combinations
    uses: ./.github/workflows/verify-sdk-go.yml

  node-sdk:
    name: Node artifact and four E2E combinations
    uses: ./.github/workflows/verify-sdk-node.yml

  python-sdk:
    name: Python artifact and four E2E combinations
    uses: ./.github/workflows/verify-sdk-python.yml

  java-sdk:
    name: Maven artifact and four E2E combinations
    uses: ./.github/workflows/verify-sdk-java.yml

  engine-tests:
    name: Engine unit and PostgreSQL invariant tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: workflow-engine/go.mod
          cache-dependency-path: workflow-engine/go.sum
      - name: Unit, race and vet tests
        working-directory: workflow-engine
        run: |
          go test -race ./...
          go vet ./...
      - name: PostgreSQL integration and race tests
        working-directory: workflow-engine
        run: go test -race -tags integration ./test/invariants/... -count=1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Readiness outage/recovery and migration command gates
        run: python workflow-engine/test/operations/run.py --output=testresults/operations
      - name: Mixed engine replicas on one database
        run: |
          git fetch --depth=1 origin tag engine-v1.1.2
          mkdir -p "$RUNNER_TEMP/mixed-engine-baseline"
          git archive engine-v1.1.2 workflow-engine | tar -x -C "$RUNNER_TEMP/mixed-engine-baseline"
          (cd "$RUNNER_TEMP/mixed-engine-baseline/workflow-engine" && go build -o "$RUNNER_TEMP/mixed-engine-baseline/engine" ./cmd/engine)
          python e2e/mixed-engine.py --baseline="$RUNNER_TEMP/mixed-engine-baseline/engine" --output=testresults/operations/mixed-engine
          if python e2e/mixed-engine.py --baseline=testresults/operations/mixed-engine/engine --engine=testresults/operations/mixed-engine/engine --output=testresults/operations/mixed-engine/negative-same-version; then
            echo 'Mixed-version gate accepted two new replicas' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: engine-operations
          path: testresults/operations/
