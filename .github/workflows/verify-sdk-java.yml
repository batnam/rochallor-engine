name: Verify Java SDK candidate

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ''
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build and verify unsigned Maven candidate and negative consumer
        working-directory: workflow-sdk-java
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p artifacts
          python scripts/verify-package.py 2>&1 | tee artifacts/verify.log
      - uses: actions/upload-artifact@v6
        with:
          name: java-sdk-candidate
          path: workflow-sdk-java/artifacts/candidate/
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: java-sdk-verification
          path: |
            workflow-sdk-java/artifacts/*.log
            workflow-sdk-java/artifacts/dependencies.txt
            workflow-sdk-java/build/reports/tests/
          if-no-files-found: ignore

  e2e:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dispatch: [polling, kafka_outbox]
        transport: [rest, grpc]
    env:
      WE_DISPATCH_MODE: ${{ matrix.dispatch }}
      E2E_SDK_FAULTS: '1'
      E2E_HEARTBEAT: '1'
      COMPOSE_PROJECT_NAME: verify-sdk-java
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: e2e/runner/go.mod
          cache-dependency-path: e2e/runner/go.sum
      - uses: actions/download-artifact@v7
        with:
          name: java-sdk-candidate
          path: workflow-sdk-java/artifacts/candidate/
      - name: Run Maven SDK E2E
        run: ./e2e/run.sh --sdk=java --transport=${{ matrix.transport }}
      - name: Verify heartbeat off and explicit unsupported error on engine v1.1.2
        if: matrix.dispatch == 'polling'
        run: |
          git fetch --depth=1 origin tag engine-v1.1.2
          mkdir -p "$RUNNER_TEMP/heartbeat-engine-baseline"
          git archive engine-v1.1.2 workflow-engine | tar -x -C "$RUNNER_TEMP/heartbeat-engine-baseline"
          docker build -t heartbeat-engine-baseline "$RUNNER_TEMP/heartbeat-engine-baseline/workflow-engine"
          export E2E_ENGINE_IMAGE=heartbeat-engine-baseline E2E_ENGINE_HEALTH_PATH=healthz
          export E2E_WORKER_IMAGE=verify-sdk-java-worker-java
          E2E_HEARTBEAT=0 E2E_SCENARIOS=linear,retry-fail,transformation \
            E2E_LOGS_DIR=e2e/logs/old-engine-off ./e2e/run.sh --sdk=java --transport=${{ matrix.transport }}
          E2E_HEARTBEAT=1 E2E_HEARTBEAT_UNSUPPORTED=1 E2E_SCENARIOS=sdk-heartbeat-unsupported \
            E2E_LOGS_DIR=e2e/logs/old-engine-on ./e2e/run.sh --sdk=java --transport=${{ matrix.transport }}
      - name: Measure heartbeat off/on on the verified worker
        if: matrix.dispatch == 'polling'
        run: |
          python3 perf/heartbeat.py --sdk=java --transport=${{ matrix.transport }} \
            --engine-image=verify-sdk-java-engine --worker-image=verify-sdk-java-worker-java \
            --output=testresults/heartbeat-cost
      - name: Save heartbeat cost evidence
        if: always() && matrix.dispatch == 'polling'
        uses: actions/upload-artifact@v6
        with:
          name: java-heartbeat-cost-${{ matrix.transport }}
          path: testresults/heartbeat-cost/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: java-e2e-${{ matrix.dispatch }}-${{ matrix.transport }}
          path: e2e/logs/
