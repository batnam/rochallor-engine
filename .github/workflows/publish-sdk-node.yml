name: Publish Node SDK

on:
  push:
    tags:
      - 'sdk-node-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    name: Verify the release candidate
    uses: ./.github/workflows/verify-sdk-node.yml
    permissions:
      contents: read
    with:
      version: ${{ github.ref_name }}

  publish-sdk-node:
    name: Publish Node SDK → npm
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v7
        with:
          name: node-sdk-candidate
          path: workflow-sdk-node/artifacts/

      - name: Verify release identity
        working-directory: workflow-sdk-node/artifacts
        run: |
          sha256sum -c SHA256SUMS
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const candidate = JSON.parse(readFileSync('package.json', 'utf8'))
          assert.equal(candidate.name, 'rochallor-workflow-sdk-node')
          assert.equal(candidate.version, process.env.GITHUB_REF_NAME.slice('sdk-node-v'.length))
          assert.equal(candidate.source, process.env.GITHUB_SHA)
          JS

      - name: Upgrade npm for Trusted Publishing (OIDC)
        run: npm install -g npm@latest

      - name: Publish the verified tarball without rebuilding
        working-directory: workflow-sdk-node/artifacts
        run: |
          VERSION=${GITHUB_REF_NAME#sdk-node-v}
          if REMOTE=$(npm view "rochallor-workflow-sdk-node@${VERSION}" dist.integrity); then
            LOCAL=$(node --input-type=module -e "import { createHash } from 'node:crypto'; import { readFileSync } from 'node:fs'; console.log('sha512-' + createHash('sha512').update(readFileSync('sdk.tgz')).digest('base64'))")
            if [ "$REMOTE" != "$LOCAL" ]; then
              echo "Version ${VERSION} already exists with different bytes; refusing to replace it" >&2
              exit 1
            fi
            echo "Identical candidate ${VERSION} is already published"
          else
            npm publish ./sdk.tgz --access public --provenance
          fi

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-sdk-node]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: node-sdk-candidate
          path: candidate/

      - name: Extract version
        id: ver
        run: echo "tag=${GITHUB_REF_NAME#sdk-node-}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          name: Node SDK ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          make_latest: false
          files: |
            candidate/sdk.tgz
            candidate/SHA256SUMS
            candidate/package.json
